<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Near-black darkroom base -->
  <rect width="64" height="64" rx="10" fill="#141311"/>
  <!-- Outer viewfinder frame in film-strip amber -->
  <rect x="6" y="6" width="52" height="52" rx="6" stroke="#E8A33D" stroke-width="2.5"/>
  <!-- 35mm filmsprocket perforations top & bottom -->
  <rect x="12" y="10" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="22" y="10" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="37" y="10" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="47" y="10" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="12" y="51" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="22" y="51" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="37" y="51" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <rect x="47" y="51" width="5" height="3" rx="0.75" fill="#E8A33D" fill-opacity="0.75"/>
  <!-- Studio Scout 3-bar equalizer / clapperboard mark -->
  <rect x="20" y="24" width="5" height="16" rx="1" fill="#E8A33D"/>
  <rect x="29.5" y="18" width="5" height="28" rx="1" fill="#EDE6D6"/>
  <rect x="39" y="24" width="5" height="16" rx="1" fill="#E8A33D"/>
  <!-- Viewfinder corner ticks -->
  <path d="M13 22V18H17" stroke="#EDE6D6" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M51 22V18H47" stroke="#EDE6D6" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M13 42V46H17" stroke="#EDE6D6" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M51 42V46H47" stroke="#EDE6D6" stroke-width="1.5" stroke-linecap="square"/>
</svg>
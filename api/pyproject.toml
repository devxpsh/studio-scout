[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devxpsh", email = "devxpiyush@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk==2.7.1",
    "google-genai==2.19.0",
    "parallel-web>=1.3.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
